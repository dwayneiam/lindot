# ~/.config/tmux/tmux.conf

set -ga terminal-overrides ",*:Tc"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind & kill-window
bind x kill-pane

setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on

set -g status-position bottom

set -g status-style 'bg=#CCCCCC fg=#222222'
set -g status-left '#[fg=#222222][#S] '
set -g status-right '󰁹 #([ -d /sys/class/power_supply/BAT0 ] && cat /sys/class/power_supply/BAT0/capacity)% |󰞌 %I:%M %p'

setw -g window-status-format '#[bg=#CCCCCC]#[fg=#333333] #I:#W #F '
setw -g window-status-current-format '#[fg=#222222]#[bg=#EFEFEF] #I:#W #F '
# setw -g window-status-activity-style '#[fg=#FFFCF0]#[bg=#AF3029] #I:#W #F '
# setw -g window-status-bell-style '#[fg=#FFFCF0]#[bg=#AF3029] #I:#W #F '

set -g pane-border-style 'fg=#333333'
set -g pane-active-border-style 'fg=#666666'

